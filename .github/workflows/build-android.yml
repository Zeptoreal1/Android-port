name: Build Voidius (Android)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the mod (Geode SDK + CLI + NDK handled by the official action)
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - name: Show produced files
        run: ls -la "${{ steps.build.outputs.build-output }}"
      - uses: actions/upload-artifact@v4
        with:
          name: prsevend.voidius-android64
          path: ${{ steps.build.outputs.build-output }}
